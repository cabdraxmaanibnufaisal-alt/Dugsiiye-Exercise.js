<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Language Translator</title>
    <style>
        *{
            box-sizing: border-box;
            padding: 0;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
           
        }
        body{
             background: linear-gradient(135deg, #FF8008, #FF0080);
        }
        .container{
            max-width: 400px;
            width: 50%;
            margin: 50px auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 10px;
           background: linear-gradient(135deg, #141E30, #6A11CB);
        }
        h1{
            text-align: center;
            margin-bottom: 20px;
            color: #fff;
        }
        label{
            display: block;
            margin-bottom: 5px;
            color: #fff;
        }
        select, textarea{
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button{
            width: 100%;
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover{
            background-color: #45a049;
        }
        h2{
            margin-block: 10px;
            color: #fff;
        }
        #translatedText{
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background-color: #f9f9f9;
            color: #000;
        }
    </style>

    
</head>
<body>
    <div class="container">
        <h1>Language Translator</h1>
        <label for="language">From:</label>
        <select id="from-language">
            <option value="">--Select a language--</option>
            <option value="so">Somali</option>
            <option value="en">English</option>
            <option value="es">Spanish</option>
            <option value="fr">French</option>
            <option value="de">German</option>
            <option value="zh">Chinese</option>
            <option value="ja">Japanese</option>
            <option value="ru">Russian</option>
            <option value="ar">Arabic</option>
            <option value="hi">Hindi</option>
            <option value="pt">Portuguese</option>
            <option value="it">Italian</option>
        </select>
        <label for="text">To:</label>
        <select id="to-language">
            <option value="">--Select a language--</option>
            <option value="so">Somali</option>
            <option value="en">English</option>
            <option value="es">Spanish</option>
            <option value="fr">French</option>
            <option value="de">German</option>
            <option value="zh">Chinese</option>
            <option value="ja">Japanese</option>
            <option value="ru">Russian</option>
            <option value="ar">Arabic</option>
            <option value="hi">Hindi</option>
            <option value="pt">Portuguese</option>
            <option value="it">Italian</option>
        </select>
        <label for="text">Text to translate:</label>
        <textarea id="text" rows="4" cols="50"></textarea>
        <button id="translate-btn">Translate</button>
        <h2>Translated Text:</h2>
        <p id="translatedText"></p>
    </div>
    <script >// ================= SELECT ELEMENTS =================
const btn = document.getElementById("translate-btn");
const fromLang = document.getElementById("from-language");
const toLang = document.getElementById("to-language");
const textInput = document.getElementById("text");
const result = document.getElementById("translatedText");

// ================= TRANSLATE FUNCTION =================
btn.addEventListener("click", async () => {

    const from = fromLang.value;
    const to = toLang.value;
    const text = textInput.value;

    if (!from || !to || !text) {
        alert("Please fill all fields");
        return;
    }
    const url = "https://text-translator2.p.rapidapi.com/translate";

const params = new URLSearchParams();
params.append("source_language", from);
params.append("target_language", to);
params.append("text", text);

const options = {
    method: "POST",
    headers: {
        "x-rapidapi-key": "0f6f0a5040mshb6c46d037121069p12afc1jsn7efc41d5a0ef",
        "x-rapidapi-host": "text-translator2.p.rapidapi.com",
        "Content-Type": "application/x-www-form-urlencoded"
    },
    body: params
};

try {
    const response = await fetch(url, options);
    const data = await response.json();

    console.log(data);

    const translated =
        data.data?.translatedText || "Translation failed";

    result.innerText = translated;

} catch (error) {
    console.error(error);
    result.innerText = "Error occurred";
}
    
});</script>
</body>
</html>
