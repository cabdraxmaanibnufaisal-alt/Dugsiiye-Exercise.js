<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Music Player</title>
    <link rel="stylesheet" href="youtubeMb3.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Arial', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background-color: #f0f0f0;
}

.music-player {

    background-color: #fff;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    padding: 30px;
    width: 350px;
    text-align: center;
}

.song-info img {
    width: 250px;
    height: 250px;
    border-radius: 10px;
    margin-bottom: 20px;
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
}

.song-info h2 {
    font-size: 24px;
    margin-bottom: 5px;
    color: #333;
}

.song-info p {
    font-size: 18px;
    color: #666;
    margin-bottom: 20px;
}

.progress-container {
    margin-bottom: 20px;
}

.progress-bar {
    background-color: #e0e0e0;
    border-radius: 5px;
    height: 6px;
    width: 100%;
    overflow: hidden;
}

.progress {
    background-color: #1db954;
    width: 0%;
    height: 100%;
    transition: width 0.1s linear;
}

.time {
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    color: #666;
    margin-top: 5px;
}

.controls {
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 20px;
}

.control-btn {
    background: none;
    border: none;
    font-size: 24px;
    color: #333;
    cursor: pointer;
    padding: 10px;
    margin: 0 15px;
    transition: color 0.3s ease;
}

.control-btn:hover {
    color: #1db954;
}

.play-btn {
    font-size: 40px;
}

.additional-controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.volume-container, .speed-container {
    display: flex;
    align-items: center;
}

.volume-container i, .speed-container i {
    color: #666;
    font-size: 18px;
    margin-right: 10px;
}

#volume {
    -webkit-appearance: none;
    width: 100px;
    height: 5px;
    background: #e0e0e0;
    outline: none;
    border-radius: 5px;
}

#volume::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 15px;
    height: 15px;
    background: #1db954;
    cursor: pointer;
    border-radius: 50%;
}

#volume::-moz-range-thumb {
    width: 15px;
    height: 15px;
    background: #1db954;
    cursor: pointer;
    border-radius: 50%;
    border: none;
}

#speed {
    padding: 5px;
    border-radius: 5px;
    border: 1px solid #ccc;
    background-color: #fff;
    color: #333;
    font-size: 14px;
    cursor: pointer;
}

#speed:focus {
    outline: none;
    border-color: #1db954;
}</style>
</head>
<body>

    <div class="music-player">
        <div class="song-info">
            <img id="cover" src="https://via.placeholder.com/250" alt="Album cover">
            <h2 id="title">Song Title</h2>
            <p id="artist">Artist Name</p>
        </div>
        <div class="progress-container">
            <div class="progress-bar">
                <div class="progress"></div>
            </div>
            <div class="time">
                <span id="current-time">0:00</span>
                <span id="duration">0:00</span>
            </div>
        </div>
        <div class="controls">
            <button id="prev" class="control-btn"><i class="fas fa-step-backward"></i></button>
            <button id="play" class="control-btn play-btn"><i class="fas fa-play"></i></button>
            <button id="next" class="control-btn"><i class="fas fa-step-forward"></i></button>
        </div>
        <div class="additional-controls">
            <div class="volume-container">
                <i class="fas fa-volume-down"></i>
                <input type="range" id="volume" min="0" max="1" step="0.1" value="1">
            </div>
            <div class="speed-container">
                <i class="fas fa-tachometer-alt"></i>
                <select id="speed">
                    <option value="0.5">0.5x</option>
                    <option value="0.75">0.75x</option>
                    <option value="1" selected>1x</option>
                    <option value="1.25">1.25x</option>
                    <option value="1.5">1.5x</option>
                    <option value="2">2x</option>
                </select>
            </div>
        </div>
    </div>
    <script>const videoElement = document.createElement("video");
videoElement.style.width = "100%";
videoElement.style.borderRadius = "15px";
videoElement.style.marginBottom = "15px";

// Ku dar gudaha player-ka
const player = document.querySelector(".music-player");
player.prepend(videoElement);

// Select DOM elements
const playBtn = document.getElementById('play');
const prevBtn = document.getElementById('prev');
const nextBtn = document.getElementById('next');
const title = document.getElementById('title');
const artist = document.getElementById('artist');
const cover = document.getElementById('cover');
const currentTimeEl = document.getElementById('current-time');
const durationEl = document.getElementById('duration');
const progress = document.querySelector('.progress');
const progressContainer = document.querySelector('.progress-bar');
const volumeSlider = document.getElementById('volume');
const speedSelect = document.getElementById('speed');

const songs = [
    {
        title: "Song One",
        artist: "Artist 1",
        cover: "./10.mp4",
        src: "Mp3.mp3"
    },
    {
        title: "Song Remix",
        artist: "Artist 2",
        cover: "./10.mp4",
        src: "./10.mp4"
    }
];

// Song data
// const songs = [
//     https://soundcloud.com/soundhelix/sets/soundhelix-examples?utm_source=clipboard&utm_medium=text&utm_campaign=social_sharing
//     { title: 'Song One', artist: 'Artist fake', cover: 'https://via.placeholder.com/250/4CAF50/FFFFFF?text=1', src: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3' },
//     { title: 'Song One', artist: 'Artist One', cover: 'https://via.placeholder.com/250/4CAF50/FFFFFF?text=1', src: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3' },
//     { title: 'Song Two', artist: 'Artist Two', cover: 'https://via.placeholder.com/250/2196F3/FFFFFF?text=2', src: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3' },
//     { title: 'Song Three', artist: 'Artist Three', cover: 'https://via.placeholder.com/250/FFC107/FFFFFF?text=3', src: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3' },
//     { title: 'Song Four', artist: 'Artist Four', cover: 'https://via.placeholder.com/250/FFC107/FFFFFF?text=3', src: './Somewhere Only We Know (Lofi)_nZ8jMVmLM-Q.mp3' }
// ];

// Keep track of songs
let songIndex = 0;
let isPlaying = false;
let speed = 1;

// Update song details
function loadSong(song) {
    title.textContent = song.title;
    artist.textContent = song.artist;
    cover.src = song.cover;
    audioElement.src = song.src;
}

// Initially load song details into DOM
loadSong(songs[songIndex]);

// Play song
function playSong() {
    playBtn.querySelector('i').classList.remove('fa-play');
    playBtn.querySelector('i').classList.add('fa-pause');
    audioElement.play().catch(e => console.error("Error playing audio:", e));
    isPlaying = true;

}

// Pause song
function pauseSong() {
    playBtn.querySelector('i').classList.remove('fa-pause');
    playBtn.querySelector('i').classList.add('fa-play');
    audioElement.pause();
    isPlaying = false;
}

// Previous song
function prevSong() {
    pauseSong();
    setTimeout(() => {
        songIndex--;
        if (songIndex < 0) {
            songIndex = songs.length - 1;
        }
        loadSong(songs[songIndex]);
        playSong();
    }, 300);
}

// Next song
function nextSong() {
    pauseSong();
    setTimeout(() => {
        songIndex++;
        if (songIndex > songs.length - 1) {
            songIndex = 0;
        }
        loadSong(songs[songIndex]);
        playSong();
    }, 300);
}

// Update progress bar
function updateProgress(e) {
    const { duration, currentTime } = e.srcElement;
    if (isNaN(duration)) return;
    const progressPercent = (currentTime / duration) * 100;
    progress.style.width = `${progressPercent}%`;

    // Calculate display for duration
    const durationMinutes = Math.floor(duration / 60);
    let durationSeconds = Math.floor(duration % 60);
    if (durationSeconds < 10) {
        durationSeconds = `0${durationSeconds}`;
    }
    
    // Update duration Element
    durationEl.textContent = `${durationMinutes}:${durationSeconds}`;
    
    // Calculate display for current
    const currentMinutes = Math.floor(currentTime / 60);
    let currentSeconds = Math.floor(currentTime % 60);
    if (currentSeconds < 10) {
        currentSeconds = `0${currentSeconds}`;
    }
    currentTimeEl.textContent = `${currentMinutes}:${currentSeconds}`;

    audioElement.playbackRate = speed;
}

// Set progress bar
function setProgress(e) {
    const width = this.clientWidth;
    const clickX = e.offsetX;
    const duration = audioElement.duration;
    if (isNaN(duration)) return;
    const newTime = (clickX / width) * duration;

  // isFinite() is a JavaScript function that determines whether a value is a finite number. It returns true if the value is a number that is not positive infinity, negative infinity, or NaN (Not-a-Number).

    if (isFinite(newTime)) {
        audioElement.currentTime = newTime;
    }
}

// Event listeners
playBtn.addEventListener('click', () => {
    if (isPlaying) {
        pauseSong();
    } else {
        playSong();
    }
});

// Change song
prevBtn.addEventListener('click', prevSong);
nextBtn.addEventListener('click', nextSong);

// Time/song update
audioElement.addEventListener('timeupdate', updateProgress);

// Click on progress bar
progressContainer.addEventListener('click', setProgress);

// Song ends
audioElement.addEventListener('ended', nextSong);

// Change volume
volumeSlider.addEventListener('input', (e) => {
    audioElement.volume = e.target.value;
});

// Change speed
speedSelect.addEventListener('change', (e) => {
    speed =  parseFloat(e.target.value);
    audioElement.playbackRate = speed;
});

// Load metadata
audioElement.addEventListener('loadedmetadata', updateProgress);</script>
</body>
</html>
